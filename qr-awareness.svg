<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1527" viewBox="0 0 1080 1527"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03152b"/><stop offset="1" stop-color="#0b3b63"/></linearGradient></defs><rect width="1080" height="1527" fill="#eef2f5"/><rect width="1080" height="475" fill="url(#bg)"/><text x="540" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="88" font-weight="900" fill="#ff2727">STOP!</text><text x="540" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="900" fill="white">THINK BEFORE YOU SCAN</text><rect x="170" y="205" width="740" height="130" rx="8" fill="#e31b23"/><text x="540" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="white">DO NOT SCAN UNKNOWN</text><text x="540" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="#ffe500">QR CODES</text><text x="55" y="430" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">SAFE SYSTEMS • SECURE SEAS</text><text x="1025" y="430" text-anchor="end" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">INDIAN NAVY</text><rect x="55" y="525" width="360" height="360" rx="24" fill="white" stroke="#111" stroke-width="10"/><rect x="100" y="570" width="270" height="270" fill="#111"/><rect x="125" y="595" width="65" height="65" fill="white"/><rect x="280" y="595" width="65" height="65" fill="white"/><rect x="125" y="750" width="65" height="65" fill="white"/><rect x="145" y="615" width="25" height="25" fill="#111"/><rect x="300" y="615" width="25" height="25" fill="#111"/><rect x="145" y="770" width="25" height="25" fill="#111"/><g fill="white"><rect x="205" y="590" width="25" height="25"/><rect x="240" y="625" width="20" height="45"/><rect x="205" y="680" width="55" height="25"/><rect x="275" y="690" width="35" height="25"/><rect x="205" y="730" width="25" height="70"/><rect x="250" y="750" width="60" height="25"/><rect x="320" y="730" width="25" height="65"/></g><circle cx="235" cy="705" r="145" fill="none" stroke="#e21d25" stroke-width="24"/><line x1="130" y1="810" x2="340" y2="600" stroke="#e21d25" stroke-width="24"/><text x="465" y="585" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#0a2345">A QR code can redirect you to a malicious</text><text x="465" y="630" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#0a2345">website, phishing page, fake payment portal</text><text x="465" y="675" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#0a2345">or malware download. It can compromise</text><text x="465" y="720" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#0a2345">your device, data and official networks.</text><rect x="45" y="920" width="990" height="75" rx="12" fill="#062653"/><text x="540" y="972" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="900" fill="white">FOLLOW <tspan fill="#ffe000">CYBER SECURITY</tspan> PRACTICES</text><g font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0a2345"><text x="75" y="1055">✓ Scan QR codes only from trusted sources.</text><text x="75" y="1115">✓ Never enter passwords, OTPs or PINs</text><text x="95" y="1150">on pages opened through unknown QR codes.</text><text x="75" y="1210">✓ Be alert to QR codes in messages, emails</text><text x="95" y="1245">and public locations without verification.</text><text x="560" y="1055">✓ Check the URL before opening any link.</text><text x="560" y="1115">✓ Do not download or install applications</text><text x="580" y="1150">prompted by an unknown QR code.</text><text x="560" y="1210">✓ Report suspicious QR codes through the</text><text x="580" y="1245">authorised cyber-security mechanism.</text></g><rect y="1300" width="1080" height="227" fill="#062653"/><text x="540" y="1360" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="900" fill="white">INFORMATION SECURITY IS EVERYONE'S</text><text x="540" y="1405" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="900" fill="white">RESPONSIBILITY</text><rect x="170" y="1435" width="740" height="58" rx="8" fill="#ffe000"/><text x="540" y="1476" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="900" fill="#111">STOP • CHECK • VERIFY • THEN SCAN</text></svg>