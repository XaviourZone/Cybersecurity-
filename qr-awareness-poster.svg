<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMin meet" style="width:100%;height:auto;display:block;max-width:100vw;background:#f4f7f9">
<rect width="900" height="1600" fill="#f4f7f9"/>

<!-- HEADER -->
<rect width="900" height="430" fill="#052f5f"/>
<text x="45" y="55" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">SAFE SYSTEMS</text>
<text x="45" y="83" fill="#fff" font-family="Arial,sans-serif" font-size="22">SECURE SEAS</text>
<text x="855" y="55" text-anchor="end" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">INDIAN NAVY</text>
<text x="450" y="180" text-anchor="middle" fill="#ff2020" font-family="Arial,sans-serif" font-size="110" font-weight="900">STOP!</text>
<text x="450" y="250" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="800">THINK BEFORE YOU SCAN</text>
<rect x="90" y="285" width="720" height="105" rx="16" fill="#f71919"/>
<text x="450" y="332" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="35" font-weight="900">DO NOT SCAN UNKNOWN</text>
<text x="450" y="372" text-anchor="middle" fill="#ffe000" font-family="Arial,sans-serif" font-size="35" font-weight="900">QR CODES</text>

<!-- WARNING -->
<rect y="430" width="900" height="350" fill="#fff"/>
<rect x="55" y="490" width="250" height="220" rx="18" fill="#fff" stroke="#111" stroke-width="7"/>
<g fill="#111">
<rect x="80" y="515" width="65" height="65"/><rect x="215" y="515" width="65" height="65"/><rect x="80" y="640" width="65" height="45"/>
<rect x="160" y="600" width="42" height="42"/><rect x="215" y="625" width="45" height="45"/><rect x="155" y="665" width="45" height="20"/>
</g>
<g fill="#fff"><rect x="97" y="532" width="31" height="31"/><rect x="232" y="532" width="31" height="31"/><rect x="97" y="657" width="31" height="28"/></g>
<circle cx="180" cy="600" r="82" fill="none" stroke="#f21b1b" stroke-width="22"/>
<line x1="120" y1="660" x2="240" y2="540" stroke="#f21b1b" stroke-width="22"/>
<text x="345" y="515" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">A QR code can redirect you to a</text>
<text x="345" y="553" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">malicious website, phishing page,</text>
<text x="345" y="591" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">fake payment portal or malware</text>
<text x="345" y="629" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">download. It can compromise</text>
<text x="345" y="667" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">your device, data and official</text>
<text x="345" y="705" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">networks.</text>

<!-- PRACTICES -->
<rect x="30" y="815" width="840" height="70" rx="12" fill="#062f5e"/>
<text x="450" y="860" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="900">FOLLOW <tspan fill="#ffe000">CYBER SECURITY</tspan> PRACTICES</text>

<g font-family="Arial,sans-serif" fill="#082d5b" font-size="25" font-weight="700">
<text x="60" y="935">✓ Scan QR codes only from trusted and verified sources.</text>
<text x="60" y="1005">✓ Check the URL before opening any link.</text>
<text x="60" y="1075">✓ Never enter passwords, OTPs or PINs on unknown pages.</text>
<text x="60" y="1145">✓ Do not download or install applications prompted by unknown QR codes.</text>
<text x="60" y="1215">✓ Be alert to QR codes in messages, emails and public locations.</text>
<text x="60" y="1285">✓ Report suspicious QR codes through the authorised cyber-security mechanism.</text>
</g>

<!-- FOOTER -->
<rect y="1330" width="900" height="270" fill="#052f5f"/>
<text x="450" y="1395" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="900">INFORMATION SECURITY IS</text>
<text x="450" y="1445" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="900">EVERYONE’S RESPONSIBILITY</text>
<rect x="75" y="1480" width="750" height="65" rx="12" fill="#ffe000"/>
<text x="450" y="1522" text-anchor="middle" fill="#111" font-family="Arial,sans-serif" font-size="31" font-weight="900">STOP • CHECK • VERIFY • THEN SCAN</text>
<text x="450" y="1575" text-anchor="middle" fill="#ffe000" font-family="Arial,sans-serif" font-size="23" font-weight="700">THINK BEFORE YOU SCAN</text>
</svg>