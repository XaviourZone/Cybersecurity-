<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#f4f7f9"/><rect width="1200" height="510" fill="#052c55"/><text x="55" y="70" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">SAFE SYSTEMS</text><text x="55" y="108" fill="white" font-family="Arial,sans-serif" font-size="30">SECURE SEAS</text><text x="1145" y="70" text-anchor="end" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">INDIAN NAVY</text><text x="600" y="190" text-anchor="middle" fill="#ff2020" font-family="Arial,sans-serif" font-size="150" font-weight="900">STOP!</text><text x="600" y="270" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="62" font-weight="800">THINK BEFORE YOU SCAN</text><rect x="130" y="310" width="940" height="125" rx="18" fill="#f71919"/><text x="600" y="365" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="48" font-weight="900">DO NOT SCAN UNKNOWN</text><text x="600" y="415" text-anchor="middle" fill="#ffe500" font-family="Arial,sans-serif" font-size="48" font-weight="900">QR CODES</text><rect y="510" width="1200" height="390" fill="white"/><rect x="75" y="570" width="330" height="280" rx="22" fill="#fff" stroke="#111" stroke-width="8"/><g fill="#111"><rect x="105" y="600" width="80" height="80"/><rect x="295" y="600" width="80" height="80"/><rect x="105" y="760" width="80" height="60"/><rect x="210" y="700" width="45" height="45"/><rect x="275" y="710" width="65" height="65"/><rect x="205" y="785" width="55" height="35"/><rect x="335" y="700" width="40" height="55"/></g><g fill="white"><rect x="125" y="620" width="40" height="40"/><rect x="315" y="620" width="40" height="40"/><rect x="125" y="775" width="40" height="30"/></g><circle cx="240" cy="710" r="105" fill="none" stroke="#f21b1b" stroke-width="28"/><line x1="165" y1="785" x2="315" y2="635" stroke="#f21b1b" stroke-width="28"/><text x="465" y="610" fill="#082d5b" font-family="Arial,sans-serif" font-size="35" font-weight="700">A QR code can redirect you to a</text><text x="465" y="655" fill="#082d5b" font-family="Arial,sans-serif" font-size="35" font-weight="700">malicious website, phishing page,</text><text x="465" y="700" fill="#082d5b" font-family="Arial,sans-serif" font-size="35" font-weight="700">fake payment portal or malware</text><text x="465" y="745" fill="#082d5b" font-family="Arial,sans-serif" font-size="35" font-weight="700">download. It can compromise</text><text x="465" y="790" fill="#082d5b" font-family="Arial,sans-serif" font-size="35" font-weight="700">your device, data and official networks.</text><rect x="35" y="930" width="1130" height="82" rx="12" fill="#062f5e"/><text x="600" y="985" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="900">FOLLOW <tspan fill="#ffe000">CYBER SECURITY</tspan> PRACTICES</text><g font-family="Arial,sans-serif" fill="#082d5b" font-size="29" font-weight="700"><text x="95" y="1085">✓ Scan QR codes only from trusted</text><text x="125" y="1125">and verified sources.</text><text x="95" y="1205">✓ Never enter passwords, OTPs or PINs</text><text x="125" y="1245">on pages opened through unknown QR codes.</text><text x="95" y="1325">✓ Be alert to QR codes in messages, emails</text><text x="125" y="1365">and public locations without verification.</text><text x="650" y="1085">✓ Check the URL before opening any link.</text><text x="650" y="1205">✓ Do not download or install applications</text><text x="680" y="1245">prompted by an unknown QR code.</text><text x="650" y="1325">✓ Report suspicious QR codes through the</text><text x="680" y="1365">authorised cyber-security mechanism.</text></g><rect y="1430" width="1200" height="370" fill="#052c55"/><text x="600" y="1510" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="48" font-weight="900">INFORMATION SECURITY IS</text><text x="600" y="1570" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="48" font-weight="900">EVERYONE’S RESPONSIBILITY</text><rect x="150" y="1630" width="900" height="85" rx="15" fill="#ffe000"/><text x="600" y="1685" text-anchor="middle" fill="#111" font-family="Arial,sans-serif" font-size="40" font-weight="900">STOP • CHECK • VERIFY • THEN SCAN</text><text x="600" y="1750" text-anchor="middle" fill="#ffe000" font-family="Arial,sans-serif" font-size="28" font-weight="700">THINK BEFORE YOU SCAN</text></svg>