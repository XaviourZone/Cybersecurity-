<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#f4f7f9"/><rect width="1200" height="500" fill="#052f5f"/><text x="55" y="68" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">SAFE SYSTEMS</text><text x="55" y="105" fill="#fff" font-family="Arial,sans-serif" font-size="30">SECURE SEAS</text><text x="1145" y="68" text-anchor="end" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">INDIAN NAVY</text><text x="600" y="205" text-anchor="middle" fill="#ff2020" font-family="Arial,sans-serif" font-size="145" font-weight="900">STOP!</text><text x="600" y="285" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="800">THINK BEFORE YOU SCAN</text><rect x="115" y="325" width="970" height="120" rx="18" fill="#f71919"/><text x="600" y="378" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="45" font-weight="900">DO NOT SCAN UNKNOWN</text><text x="600" y="425" text-anchor="middle" fill="#ffe000" font-family="Arial,sans-serif" font-size="45" font-weight="900">QR CODES</text><rect y="500" width="1200" height="390" fill="#fff"/><rect x="65" y="565" width="330" height="270" rx="22" fill="#fff" stroke="#111" stroke-width="8"/><g fill="#111"><rect x="95" y="595" width="82" height="82"/><rect x="283" y="595" width="82" height="82"/><rect x="95" y="750" width="82" height="55"/><rect x="205" y="695" width="48" height="48"/><rect x="275" y="705" width="65" height="65"/><rect x="205" y="770" width="55" height="35"/><rect x="335" y="695" width="30" height="55"/></g><g fill="#fff"><rect x="116" y="616" width="40" height="40"/><rect x="304" y="616" width="40" height="40"/><rect x="116" y="765" width="40" height="28"/></g><circle cx="230" cy="700" r="104" fill="none" stroke="#f21b1b" stroke-width="28"/><line x1="155" y1="775" x2="305" y2="625" stroke="#f21b1b" stroke-width="28"/><line x1="445" y1="575" x2="445" y2="820" stroke="#082d5b" stroke-width="5"/><text x="485" y="600" fill="#082d5b" font-family="Arial,sans-serif" font-size="31" font-weight="700">A QR code can redirect you to a</text><text x="485" y="643" fill="#082d5b" font-family="Arial,sans-serif" font-size="31" font-weight="700">malicious website, phishing page,</text><text x="485" y="686" fill="#082d5b" font-family="Arial,sans-serif" font-size="31" font-weight="700">fake payment portal or malware</text><text x="485" y="729" fill="#082d5b" font-family="Arial,sans-serif" font-size="31" font-weight="700">download. It can compromise</text><text x="485" y="772" fill="#082d5b" font-family="Arial,sans-serif" font-size="31" font-weight="700">your device, data and official</text><text x="485" y="815" fill="#082d5b" font-family="Arial,sans-serif" font-size="31" font-weight="700">networks.</text><rect x="35" y="925" width="1130" height="82" rx="12" fill="#062f5e"/><text x="600" y="980" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="900">FOLLOW <tspan fill="#ffe000">CYBER SECURITY</tspan> PRACTICES</text><circle cx="85" cy="1085" r="24" fill="#1e9d45"/><text x="85" y="1094" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="900">✓</text><text x="130" y="1075" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Scan QR codes only from</text><text x="130" y="1110" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">trusted and verified sources.</text><circle cx="85" cy="1190" r="24" fill="#fff" stroke="#e31b1b" stroke-width="6"/><text x="85" y="1199" text-anchor="middle" fill="#e31b1b" font-family="Arial,sans-serif" font-size="24" font-weight="900">!</text><text x="130" y="1180" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Never enter passwords,</text><text x="130" y="1215" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">OTPs or PINs on unknown pages.</text><circle cx="85" cy="1300" r="24" fill="#fff" stroke="#e31b1b" stroke-width="6"/><text x="85" y="1309" text-anchor="middle" fill="#e31b1b" font-family="Arial,sans-serif" font-size="24" font-weight="900">!</text><text x="130" y="1290" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Be alert to QR codes in</text><text x="130" y="1325" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">messages, emails and public places.</text><circle cx="650" cy="1085" r="24" fill="#fff" stroke="#082d5b" stroke-width="6"/><text x="650" y="1094" text-anchor="middle" fill="#082d5b" font-family="Arial,sans-serif" font-size="19" font-weight="900">URL</text><text x="700" y="1075" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Check the URL before</text><text x="700" y="1110" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">opening any link.</text><circle cx="650" cy="1190" r="24" fill="#fff" stroke="#e31b1b" stroke-width="6"/><text x="650" y="1199" text-anchor="middle" fill="#e31b1b" font-family="Arial,sans-serif" font-size="24" font-weight="900">!</text><text x="700" y="1180" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Do not download or install</text><text x="700" y="1215" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">apps prompted by unknown QR</text><text x="700" y="1250" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">codes.</text><circle cx="650" cy="1335" r="24" fill="#fff" stroke="#082d5b" stroke-width="6"/><text x="650" y="1344" text-anchor="middle" fill="#082d5b" font-family="Arial,sans-serif" font-size="25" font-weight="900">!</text><text x="700" y="1325" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Report suspicious QR codes</text><text x="700" y="1360" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">through the authorised</text><text x="700" y="1395" fill="#082d5b" font-family="Arial,sans-serif" font-size="27" font-weight="700">cyber-security mechanism.</text><rect y="1430" width="1200" height="370" fill="#052f5f"/><text x="600" y="1510" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="47" font-weight="900">INFORMATION SECURITY IS</text><text x="600" y="1570" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="47" font-weight="900">EVERYONE’S RESPONSIBILITY</text><rect x="125" y="1630" width="950" height="85" rx="15" fill="#ffe000"/><text x="600" y="1685" text-anchor="middle" fill="#111" font-family="Arial,sans-serif" font-size="39" font-weight="900">STOP • CHECK • VERIFY • THEN SCAN</text><text x="600" y="1755" text-anchor="middle" fill="#ffe000" font-family="Arial,sans-serif" font-size="30" font-weight="700">THINK BEFORE YOU SCAN</text></svg>